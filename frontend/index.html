<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
    --color-bg: #201E1D;
    --color-surface: #2D2B2B;
    --color-text: #F3F2F2;
    --color-divider: #605D5D;

    --color-accent: #EC3013;
    --color-accent-500: #FF563C; /* prioridade alta */
    --color-accent-300: #FFC4B8; /* prioridade média */

    --color-neutral-400: #BAB6B6; /* prioridade baixa */
  }
</style>
</head>

<body class="bg-bg text-text">
  <div id="loading-overlay" class="hidden fixed inset-0 z-50 backdrop-blur-sm bg-black/40 flex items-center justify-center">
    <img src="assets/beca-avatar.png" class="w-20 h-20 rounded-full object-cover animate-spin">
  </div>
  <!-- Header mobile -->
  <header class="flex divide-x divide-divider border-b border-divider  mb-4 md:hidden">
    <section class="flex-1 p-4">
      <h2 class="text-xs text-neutral-400">EM ABERTO</h2>
      <p id="open-count" class="text-3xl font-bold">--</p>
    </section>
    <section class="flex-1 p-4">
      <h2 class="text-xs text-neutral-400">PARA HOJE</h2>
      <p id="today-count-header" class="text-3xl font-bold text-accent">--</p>
    </section>
  </header>

  <!-- Header desktop (novo) -->
  <header class="hidden md:flex items-center justify-between px-6 py-4 border-b border-divider mb-4">
    <div class="flex items-center gap-4">
      <h1 class="text-lg font-bold">TAREFAS</h1>
      <span class="text-accent text-sm">
        <span id="open-count-desktop"></span> em aberto
      </span>
    </div>


    <div class="flex items-center gap-4">

      <input type="search" id="search-input-desktop" placeholder="Buscar título ou descrição" class="bg-transparent border border-divider rounded-lg px-4 py-2 text-sm placeholder-neutral-400 w-96">

      <button type="button" id="btn-new-task-desktop" class="bg-accent rounded-lg px-4 py-2 text-xs font-bold">
        NOVA TAREFA +
      </button>
    </div>
  </header>

  <main class="px-4 pb-24 md:pb-6">
    <section class="mb-4 md:hidden">
      <form>
        <input type="search" id="search-input" placeholder="Buscar título ou descrição" class="w-full bg-transparent border border-divider rounded-full px-4 py-3 text-sm placeholder-neutral-400">
      </form>
    </section>
    <nav class="mb-2 md:flex md:items-center md:justify-between">
      <ul class="flex gap-2 overflow-x-auto pb-2">
        <li><button type="button" data-filter="all" class="whitespace-nowrap rounded-full px-3 py-1 bg-accent text-xs">TODAS <span id="count-all" class="hidden md:inline"></span></button></li>
        <li><button type="button" data-filter="today" class="whitespace-nowrap rounded-full px-3 py-1 bg-divider text-xs">HOJE <span id="count-today" class="hidden md:inline"></span></button></li>
        <li><button type="button" data-filter="priority" class="whitespace-nowrap rounded-full px-3 py-1 bg-divider text-xs">PRIORIDADE ALTA <span id="count-priority" class="hidden md:inline"></span></button></li>
        <li><button type="button" data-filter="completed" class="whitespace-nowrap rounded-full px-3 py-1 bg-divider text-xs">CONCLUÍDAS <span id="count-completed" class="hidden md:inline"></span></button></li>
      </ul>
      <span id="count-overdue" class="hidden md:inline text-accent text-xs"></span>
    </nav>

    <button type="button" id="btn-new-task" class="fixed bottom-4 left-3 right-3 bg-accent rounded-lg p-4 text-xs font-bold md:hidden">
      NOVA TAREFA +
    </button>
    <div id="task-modal" class="hidden fixed inset-0 bg-black/50 z-40 flex justify-center items-end md:items-center">
      <div class="w-full md:max-w-md rounded-t-2xl md:rounded-2xl bg-surface p-6">
        <div class=" flex justify-between items-center mb-4">
          <h2 id="modal-title" class="text-lg font-bold">NOVA TAREFA</h2>
          <button type="button" id="btn-close-modal" class="font-bold text-accent text-xs">FECHAR</button>
        </div>
        <form id="task-form">
          <input type="text" id="task-title" placeholder="O que precisa ser feito?" required class="w-full bg-transparent border-b border-divider pb-2 mb-4 font-bold text-lg placeholder-neutral-400 focus:outline-none">

          <textarea id="task-description" placeholder="Descrição (opcional)" class="w-full bg-transparent border border-divider rounded-lg p-3 mb-4 text-sm placeholder-neutral-400 focus:outline-none" rows="2"></textarea>

          <input type="date" id="task-date" class="w-full bg-transparent border border-divider rounded-lg p-3 mb-4 text-sm">

          <div class="flex gap-2 mb-2">
            <button type="button" data-priority="alta" class="flex-1 border border-divider rounded-lg py-2 text-xs">ALTA</button>
            <button type="button" data-priority="media" class="flex-1 border border-divider rounded-lg py-2 text-xs bg-accent">MÉDIA</button>
            <button type="button" data-priority="baixa" class="flex-1 border border-divider rounded-lg py-2 text-xs">BAIXA</button>
          </div>
          <p id="default-priority" class="text-xs text-neutral-400 mb-4">PRIORIDADE: MÉDIA</p>

          <button type="submit" id="btn-submit-task" class="w-full font-bold bg-accent rounded-lg p-4 mb-3 text-xs">CRIAR TAREFA</button>
          <button id="btn-delete-task" type="button" class="hidden w-full font-bold bg-accent rounded-lg p-4 mb-3 text-xs">EXCLUIR</button>
        </form>
      </div>
    </div>

    <ul id="task-list"></ul>

    <button id="btn-load-more" type="button" class="w-full font-bold border border-divider rounded-lg p-4 mb-3 text-xs">
      CARREGAR MAIS
    </button>

  </main>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/main.js"></script>
</body>

</html>
