<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
    --color-bg: #201E1D;
    --color-surface: #2D2B2B;
    --color-text: #F3F2F2;
    --color-divider: #605D5D;

    --color-accent: #EC3013;
    --color-accent-500: #FF563C; /* prioridade alta */
    --color-accent-300: #FFC4B8; /* prioridade média */

    --color-neutral-400: #BAB6B6; /* prioridade baixa */
  }
</style>
</head>

<body class="bg-bg text-text">
  <header class="flex divide-x divide-divider border-b border-divider  mb-4">
    <section class="flex-1 p-4">
      <h2 class="text-xs text-neutral-400">EM ABERTO</h2>
      <p class="text-3xl font-bold">6</p>
    </section>
    <section class="flex-1 p-4">
      <h2 class="text-xs text-neutral-400">PARA HOJE</h2>
      <p class="text-3xl font-bold text-accent">1</p>
    </section>
  </header>
  <main class="px-4 pb-24">
    <section class="mb-4">
      <form>
        <input type="search" id="search-input" placeholder="Buscar título ou descrição" class="w-full bg-transparent border border-divider rounded-full px-4 py-3 text-sm placeholder-neutral-400">
      </form>
    </section>
    <nav class="mb-2">
      <ul class="flex gap-2 overflow-x-auto pb-2">
        <li><button type="button" class="whitespace-nowrap rounded-full px-3 py-1 bg-divider text-xs">TODAS</button></li>
        <li><button type="button" class="whitespace-nowrap rounded-full px-3 py-1 bg-divider text-xs">HOJE</button></li>
        <li><button type="button" class="whitespace-nowrap rounded-full px-3 py-1 bg-divider text-xs">PRIORIDADE</button></li>
        <li><button type="button" class="whitespace-nowrap rounded-full px-3 py-1 bg-divider text-xs ">CONCLUÍDAS</button></li>
      </ul>
    </nav>

    <div class="fixed bottom-0 left-0 right-0 bg-bg p-4">
      <button type="button" id="btn-new-task" class="w-full bg-accent rounded-lg p-4 text-xs font-bold">
        NOVA TAREFA +
      </button> <!-- lembrar de aplicar esses layout de botão quando abrir o modal -->
    </div>
    <div id="task-modal" class="hidden fixed inset-0 bg-black/50 flex justify-center items-end">
      <div class="w-full rounded-t-lg bg-surface p-2">
        <div class="flex justify-between">
          <h2 id="modal-title"> NOVA TAREFA </h2>
          <button type="button" id="btn-close-modal" class="font-bold"> FECHAR </button>
        </div>
        <form id="task-form">
          <input type="text" id="task-title" placeholder="O que precisa ser feito?" class="font-bold">
          <textarea id="task-description" placeholder="Descrição (opcional)"></textarea>
          <input type="date" id="task-date">
          <div class="flex gap-2">
            <button type="button" data-prioridade="alta" class="flex-1 border border-divider rounded-lg py-2 text-xs">⭡ ALTA</button>
            <button type="button" data-prioridade="media" class="flex-1 border border-divider rounded-lg py-2 text-xs bg-accent">→ MÉDIA</button>
            <button type="button" data-prioridade="baixa" class="flex-1 border border-divider rounded-lg py-2 text-xs">⭣ BAIXA</button>
          </div>
          <p id="prioridade-padrao"> PRIORIDADE: MÉDIA </p>
          <button type="submit" id="btn-submit-task" class="w-full font-bold bg-accent rounded-lg p-4 mb-3 text-xs"> CRIAR TAREFA </button>
          <button id="btn-delete-task" type="button" class="hidden w-full font-bold bg-accent rounded-lg p-4 mb-3 text-xs"> EXCLUIR </button>
        </form>
      </div>
    </div>

    <ul id="task-list"></ul>

    <button id="btn-load-more" type="button" class="w-full font-bold border border-divider rounded-lg p-4 mb-3 text-xs">
      CARREGAR MAIS
    </button>

  </main>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/main.js"></script>
</body>

</html>
