<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
    --color-bg: #201E1D;
    --color-surface: #2D2B2B;
    --color-text: #F3F2F2;
    --color-divider: #605D5D;

    --color-accent: #EC3013;
    --color-accent-500: #FF563C; /* prioridade alta */
    --color-accent-300: #FFC4B8; /* prioridade média */

    --color-neutral-400: #BAB6B6; /* prioridade baixa */
  }
</style>
</head>

<body class="bg-bg text-text">
  <header>
    <section>
      <h2>EM ABERTO</h2>
      <p>6</p>
    </section>
    <section>
      <h2>PARA HOJE</h2>
      <p>1</p>
    </section>
  </header>
  <main>
    <section>
      <form>
        <input type="search" placeholder="Buscar título ou descrição">
      </form>
    </section>

    <nav>
      <ul class="flex gap-2">
        <li><button type="button" class="rounded-full px-3 py-1 bg-divider text-xs">TODAS</button></li>
        <li><button type="button" class="rounded-full px-3 py-1 bg-divider text-xs">HOJE</button></li>
        <li><button type="button" class="rounded-full px-3 py-1 bg-divider text-xs">PRIORIDADE</button></li>
        <li><button type="button" class="rounded-full px-3 py-1 bg-divider text-xs ">CONCLUÍDAS</button></li>
      </ul>
    </nav>

    <section>
      <ul>
        <li>
          <article class="bg-surface rounded-lg p-4 mb-3">
            <label for="task-1" class="flex justify-between">
              <div>
                <input type="checkbox" id="task-1">
                <strong>Comprar leite</strong>
              </div>
              <span> ⬆ </span>
            </label>
            <p class="line-clamp-1">Comprar leite integral no supermercado</p>
            <footer class="flex gap-2">
              <span class="rounded-full px-3 py-1 bg-divider text-xs">HOJE</span>
              <span class="rounded-full px-3 py-1 bg-divider text-xs">ALTA</span>
            </footer>
          </article>
        </li>

        <!--Adicionar outras tarefas-->
      </ul>
    </section>

    <div class="bg-accent rounded-lg p-4 mb-3 text-xs">
      <button type="button" class="font-bold"> NOVA TAREFA + </button>
    </div>

    <h1 class="text-accent">Teste</h1>
    <div id="status"> Carregando... </div>

    <ul id="task-list"></ul>

  </main>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/main.js"></script>
</body>

</html>
